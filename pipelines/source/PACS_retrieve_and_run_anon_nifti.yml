---
authors: Sandip Samal <dev@babymri.org>
name: "PACS query, retrieve, registration verification, and run pipeline in CUBE 20250806"
description: "Query PACS for DICOM images, retrieve in CUBE, and verify and run anon pipeline"
category: Imaging
locked: false
plugin_tree:
  - title: PACS-query
    plugin: pl-pacs_query v1.0.9
    previous: ~
    plugin_parameter_defaults:
      PACSurl: 'http://localhost:4005/api/v1/'
      PACSname: 'MINICHRISORTHANC'
      PACSdirective: ''
      reportName: 'search_results'
  - title: PACS-retrieve
    plugin: pl-pacs_retrieve v1.0.7
    previous: PACS-query
    plugin_parameter_defaults:
      inputJSONfile: "search_results.json"
      copyInputFile: True
      src_aet: MINICHRISORTHANC
      dst_aet: ChRIS
      src_ip: 192.168.130.1
      src_port: 4242
  - title: verify-registration
    plugin: pl-dy_regiflow v1.1.5
    previous: PACS-retrieve
    plugin_parameter_defaults:
      CUBEurl: "http://localhost:8000/api/v1/"
      inputJSONfile: 'search_results.json'
      PACSname: "MINICHRISORTHANC"
      PACSurl: "http://localhost:4005/api/v1/"
      neuroLocation: ""
      folderName: ""
      maxPoll: 10
